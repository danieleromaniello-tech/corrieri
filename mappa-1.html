<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dove sono i corrieri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:system-ui,sans-serif}
#map{height:68vh}
#lista{padding:12px}
.riga{padding:10px 0;border-bottom:1px solid #ddd}
.vecchio{color:#999}
.pizzeria{font-size:26px;text-align:center;line-height:32px;background:none;border:0}
.plz{font-size:11px;font-weight:700;color:#1d4ed8;text-align:center;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
</style>
</head>
<body>
<div id="map"></div>
<div style="padding:8px 12px"><button id="tp" style="font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #bbb">Nascondi percorsi</button> <button id="ct" style="font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #bbb">Centra</button> <button id="tz" style="font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #bbb">Nascondi zone</button> <select id="sp" style="font:inherit;padding:8px;border-radius:8px;border:1px solid #bbb"><option value="">Turni passati…</option></select></div>
<div id="lista">Nessun corriere in turno.</div>
<div id="zl" style="padding:0 12px 16px;font-size:13px;color:#555"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getDatabase, ref, onValue} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyC0iYvybNzE4TcafE8-lMAgLXRZuKECEz8",
  authDomain: "corrieri-pizza.firebaseapp.com",
  databaseURL: "https://corrieri-pizza-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "corrieri-pizza",
  appId: "1:531441713887:web:c9ce9ecc0a2b75034e1f6a"
};
const db = getDatabase(initializeApp(firebaseConfig));
const map = L.map("map").setView([48.1374, 11.5755], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {attribution: "© OpenStreetMap"}).addTo(map);
const marker = {};
let primaVolta = true;
let pizzeria = null;
const pIcon = L.divIcon({html: "🍕", className: "pizzeria", iconSize: [32, 32]});
fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent("Jagdstraße 2, 80639 München"))
  .then(r => r.json())
  .then(r => {
    if (!r[0]) return;
    pizzeria = [parseFloat(r[0].lat), parseFloat(r[0].lon)];
    L.marker(pizzeria, {icon: pIcon}).addTo(map).bindTooltip("Feinkost alla famiglia", {permanent: true, direction: "bottom"});
    if (primaVolta) map.setView(pizzeria, 15);
  })
  .catch(() => {});
function minDaPizzeria(pos) {
  if (!pizzeria) return "";
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(pos[0] - pizzeria[0]), dLng = rad(pos[1] - pizzeria[1]);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(pizzeria[0])) * Math.cos(rad(pos[0])) * Math.sin(dLng / 2) ** 2;
  const km = 2 * R * Math.asin(Math.sqrt(a)) * 1.3;
  return " · circa " + Math.max(1, Math.round(km / 25 * 60)) + " min dalla pizzeria";
}
function disegna(dati) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  Object.keys(marker).forEach(n => { if (!dati[n]) { map.removeLayer(marker[n]); delete marker[n]; } });
  const punti = [];
  Object.entries(dati).forEach(([nome, d]) => {
    const pos = [d.lat, d.lng];
    punti.push(pos);
    if (marker[nome]) marker[nome].setLatLng(pos);
    else marker[nome] = L.marker(pos, {icon: icona(nome)}).addTo(map).bindTooltip(nome, {permanent: true, direction: "bottom", offset: [0, 16]});
    const sec = Math.round((Date.now() - d.t) / 1000);
    const vecchio = sec > 120;
    const riga = document.createElement("div");
    riga.className = "riga" + (vecchio ? " vecchio" : "");
    riga.textContent = emoji(nome) + " " + nome + ": " + (vecchio ? "non aggiornato da " + Math.round(sec / 60) + " min" : "aggiornato " + sec + " s fa") + (vecchio ? "" : (d.v != null ? " · " + d.v + " km/h" : "") + minDaPizzeria(pos));
    lista.appendChild(riga);
  });
  if (!punti.length) lista.textContent = "Nessun corriere in turno.";

}
const COL = ["#1f9d6b", "#c2a000", "#c23a7a", "#0f766e", "#b45309", "#4338ca", "#be123c"];
const NOMI = ["Panda bianca", "Panda blu", "Ka", "500", "Punto", "Sandra", "Daniele"];
const EMO = ["🚗", "🚙", "🚕", "🚐", "🚓", "🏎️", "🚚"];
const FORME = {
  panda: ["M6 28 V18 Q6 15 9 14 L17 13 L21 6 H46 Q48 6 49 8 L53 15 L57 17 Q60 18 60 21 V28 Z", "M22 13 L25 8 H33 V13 Z M36 13 V8 H44 L47 13 Z", [[17, 29, 6], [49, 29, 6]]],
  ka: ["M6 28 V20 Q6 16 10 15 L18 13 Q22 5 28 5 H40 Q46 5 50 13 L56 15 Q60 17 60 21 V28 Z", "M23 13 Q26 8 30 8 H33 V13 Z M36 13 V8 H40 Q43 8 46 13 Z", [[17, 29, 6], [49, 29, 6]]],
  cinquecento: ["M8 28 V20 Q8 14 14 12 Q18 5 32 5 Q46 5 50 12 Q56 14 56 20 V28 Z", "M21 12 Q24 8 30 8 V12 Z M34 12 V8 Q42 8 46 12 Z", [[18, 29, 5.5], [46, 29, 5.5]]],
  punto: ["M3 28 V19 Q3 16 7 15 L18 13 L25 6 H42 Q45 6 47 9 L56 15 Q61 17 61 21 V28 Z", "M25 13 L28 8 H35 V13 Z M38 13 V8 H43 L49 13 Z", [[15, 29, 6], [50, 29, 6]]],
  tesla: ["M2 28 V22 Q2 19 8 18 L20 15 Q26 7 34 7 H40 Q46 7 50 15 L58 18 Q62 19 62 23 V28 Z", "M25 15 Q29 9 34 9 V15 Z M37 15 V9 H40 Q44 9 47 15 Z", [[15, 29, 6], [50, 29, 6]]],
  hummer: ["M4 30 V13 Q4 10 7 10 H48 L56 17 H60 Q62 17 62 20 V30 Z", "M10 12 H22 V19 H10 Z M25 12 H38 V19 H25 Z M41 12 H48 L53 19 H41 Z", [[17, 31, 8], [49, 31, 8]]]
};
const auto = (forma, corpo, bordo, vetri) => {
  const f = FORME[forma];
  return '<svg viewBox="0 0 64 40" width="26" height="16"><path d="' + f[0] + '" fill="' + corpo + '" stroke="' + bordo + '" stroke-width="1.5"/><path d="' + f[1] + '" fill="' + vetri + '"/>'
    + f[2].map(w => '<circle cx="' + w[0] + '" cy="' + w[1] + '" r="' + w[2] + '" fill="#222"/><circle cx="' + w[0] + '" cy="' + w[1] + '" r="' + (w[2] / 2.4) + '" fill="#ccc"/>').join("") + '</svg>';
};
const SVG = {
  "Panda bianca": auto("panda", "#ffffff", "#9ca3af", "#9fc5e8"),
  "Panda blu": auto("panda", "#87ceeb", "#4f9bc2", "#eaf6ff"),
  "Ka": auto("ka", "#f472b6", "#be185d", "#dbeafe"),
  "500": auto("cinquecento", "#1f1f1f", "#666666", "#9fc5e8"),
  "Punto": auto("punto", "#1f1f1f", "#666666", "#9fc5e8"),
  "Sandra": auto("tesla", "#1f1f1f", "#666666", "#9fc5e8"),
  "Daniele": auto("hummer", "#dc2626", "#7f1d1d", "#bfdbfe")
};
function emoji(n) { return EMO[Math.max(0, NOMI.indexOf(n))]; }
const PANDA = '<svg width="28" height="18" viewBox="0 0 40 24"><path d="M3 17v-5c0-1 .6-1.800 1.600-2.100L9 8.500 11.500 4c.4-.7 1-1 1.800-1h13.400c.8 0 1.500.4 1.900 1L31 8.500l3.400 1.400c1 .3 1.600 1.100 1.600 2.100v5c0 1-.8 1.800-1.800 1.800H4.800C3.800 18.800 3 18 3 17z" fill="#fff" stroke="#8a95a1" stroke-width="1"/><path d="M13 4.800h5.500v4.400H10.800zM20.500 4.800H26l2.200 4.400h-7.700z" fill="#5b6b7a"/><circle cx="11" cy="19" r="3.400" fill="#222"/><circle cx="29" cy="19" r="3.400" fill="#222"/><circle cx="11" cy="19" r="1.400" fill="#ccc"/><circle cx="29" cy="19" r="1.400" fill="#ccc"/></svg>';
function icona(n) {
  const c = COL[Math.max(0, NOMI.indexOf(n))];
  return L.divIcon({
    className: "", iconSize: [36, 36], iconAnchor: [18, 18],
    html: '<div style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:4px solid ' + c + ';box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:19px">' + (SVG[n] || emoji(n)) + '</div>'
  });
}
const linee = {};
let mostraPercorsi = true;
onValue(ref(db, "percorsi"), snap => {
  const dati = snap.val() || {};
  Object.keys(linee).forEach(n => { if (!dati[n]) { map.removeLayer(linee[n]); delete linee[n]; } });
  Object.entries(dati).forEach(([nome, punti]) => {
    const pts = Object.values(punti).sort((a, b) => a.t - b.t).map(p => [p.lat, p.lng]);
    if (linee[nome]) linee[nome].setLatLngs(pts);
    else linee[nome] = L.polyline(pts, {color: COL[Math.max(0, NOMI.indexOf(nome))], weight: 4, opacity: 0.8});
    if (mostraPercorsi) linee[nome].addTo(map);
  });
});
document.getElementById("tp").onclick = () => {
  mostraPercorsi = !mostraPercorsi;
  Object.values(linee).forEach(l => mostraPercorsi ? l.addTo(map) : map.removeLayer(l));
  document.getElementById("tp").textContent = mostraPercorsi ? "Nascondi percorsi" : "Mostra percorsi";
};
let storicoLinea = null;
let storico = {};
onValue(ref(db, "storico"), snap => {
  storico = snap.val() || {};
  const sel = document.getElementById("sp");
  const cur = sel.value;
  sel.innerHTML = '<option value="">Turni passati…</option>';
  Object.entries(storico).sort((a, b) => (b[1].inizio || 0) - (a[1].inizio || 0)).forEach(([id, s]) => {
    const o = document.createElement("option");
    o.value = id;
    o.textContent = s.nome + " · " + new Date(s.inizio).toLocaleString("it-IT", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
    sel.appendChild(o);
  });
  sel.value = cur;
});
document.getElementById("sp").onchange = e => {
  if (storicoLinea) { map.removeLayer(storicoLinea); storicoLinea = null; }
  const s = storico[e.target.value];
  if (!s || !s.punti) return;
  const pts = Object.values(s.punti).sort((a, b) => a.t - b.t).map(p => [p.lat, p.lng]);
  storicoLinea = L.polyline(pts, {color: "#555", weight: 4, dashArray: "8 6"}).addTo(map);
  map.fitBounds(storicoLinea.getBounds(), {padding: [40, 40]});
};
const PLZ = ["80639", "80634", "80636", "80637", "80638", "80992", "80993", "80333", "80335", "80336", "80809", "80806", "81373", "80797", "80798", "80689", "80687", "80686"];
const zone = L.layerGroup().addTo(map);
let mostraZone = true;
document.getElementById("zl").textContent = "Zone di consegna: " + PLZ.join(", ");
function disegnaZona(plz, r) {
  const lat = parseFloat(r.lat), lon = parseFloat(r.lon), g = r.geojson;
  const stile = {color: "#2563eb", weight: 1.5, fillOpacity: 0.08};
  if (g && (g.type === "Polygon" || g.type === "MultiPolygon")) L.geoJSON(g, {style: stile, interactive: false}).addTo(zone);
  else L.circle([lat, lon], Object.assign({radius: 1500, interactive: false}, stile)).addTo(zone);
  L.marker([lat, lon], {icon: L.divIcon({className: "plz", html: plz, iconSize: [44, 16], iconAnchor: [22, 8]}), interactive: false}).addTo(zone);
}
(async () => {
  for (const plz of PLZ) {
    let r = null;
    try { r = JSON.parse(localStorage.getItem("plz_" + plz)); } catch (e) {}
    if (!r) {
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&polygon_geojson=1&polygon_threshold=0.0005&country=de&postalcode=" + plz);
        const j = await res.json();
        if (j[0]) {
          r = {lat: j[0].lat, lon: j[0].lon, geojson: j[0].geojson};
          try { localStorage.setItem("plz_" + plz, JSON.stringify(r)); } catch (e) {}
        }
      } catch (e) {}
      await new Promise(s => setTimeout(s, 1100));
    }
    if (r) disegnaZona(plz, r);
  }
})();
document.getElementById("tz").onclick = () => {
  mostraZone = !mostraZone;
  if (mostraZone) zone.addTo(map); else map.removeLayer(zone);
  document.getElementById("tz").textContent = mostraZone ? "Nascondi zone" : "Mostra zone";
};
document.getElementById("ct").onclick = () => { if (pizzeria) map.setView(pizzeria, 15); };
let ultimi = {};
onValue(ref(db, "corrieri"), snap => { ultimi = snap.val() || {}; disegna(ultimi); });
setInterval(() => disegna(ultimi), 10000);
</script>
</body>
</html>
